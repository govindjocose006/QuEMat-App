name: Lab Hub validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run typecheck:release
      - name: Parse Windows release setup scripts without executing them
        shell: pwsh
        run: |
          Get-ChildItem scripts/*release-setup.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "Release setup script syntax check failed: $($_.Name)" }
          }
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          PG_TEST_HOST: 127.0.0.1
          PG_TEST_PORT: 5432
          PG_TEST_USER: postgres
          PG_TEST_PASSWORD: synthetic-ci-only

  windows-release:
    # This public repository uses existing free standard hosted CI, no cloud DB.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck:release
      - name: Parse release setup scripts without executing interactive setup
        shell: pwsh
        run: |
          Get-ChildItem scripts/*release-setup.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "Release setup script syntax check failed: $($_.Name)" }
          }
      - name: Exercise guarded CLI and archive checks offline on Windows
        run: npx --no-install vitest run tests/phase3c-release-offline.test.ts
